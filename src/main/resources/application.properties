spring.application.name=fastFurious

# MySql Connection
spring.datasource.url=jdbc:mysql://localhost:3306/root?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=juheilu
spring.jpa.show-sql=true

# H2 Connection
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=

# H2 Client
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Show SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true

# --- Impressora ---
# "rede" = socket TCP direto (s\u00f3 funciona se o Spring estiver na mesma rede da impressora)
# "agente" = envia o cupom por WebSocket para um agente local no caixa
impressora.modo=agente
impressora.host=192.168.0.50
impressora.porta=9100

# --- Webhook (use vari\u00e1veis de ambiente em produ\u00e7\u00e3o, nunca commite o segredo) ---
pagamento.webhook.segredo=${WEBHOOK_SEGREDO}

# --- Cielo (confirme os nomes/credenciais no Portal do Desenvolvedor) ---
cielo.client-id=${CIELO_CLIENT_ID}
cielo.access-token=${CIELO_ACCESS_TOKEN}
cielo.merchant-id=${CIELO_MERCHANT_ID}

# Sandbox da Cielo (comente para usar produ\u00e7\u00e3o):
